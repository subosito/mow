name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet root
        run: go vet ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Test root
        run: go test -race ./...

      - name: Build binaries
        run: |
          ver="$(tr -d ' \n' < VERSION)"
          go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X github.com/subosito/mow/internal/engine.Version=${ver}" \
            -o bin/mow ./cmd/mow
          ./bin/mow version
          ./bin/mow version | grep -F "mow $ver"
