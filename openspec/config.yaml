schema: spec-driven

context: |
  Language: English. Keep OpenSpec headings and SHALL/MUST keywords in English.

  Module: github.com/subosito/mow — standalone Go 1.26.4+ agent harness.
  LLM access is OpenAI-compatible or Anthropic-compatible HTTP. No gateway,
  sibling repo, or host UI is required to build, test, or run Engine.

  Stock binary cmd/mow blank-imports ext/{acp,cli,tty,proc,cmdhook,mcp,goal}.
  Application workflows (job, ops, review, media) live in external application modules.
  Focus exists in custom-host as opt-in hooks and is not linked by either default host.

  Public samples (docs, README, CLI help, fixtures, this openspec/ tree) must
  not name private host products, fleet peers, or stale model generations.
  Use current public model ids and generic roles (peer-agent, api, gateway).

  Security: default tools are read, glob, grep. Write/shell need host/CLI
  grant. File tools are path-jailed; bash is not. Project config cannot set
  credentials, endpoints, power tools, extra_roots, or raise spend knobs.
  Trust is out-of-band under $MOW_HOME/trusted.

  Build: devenv shell -- just verify (vet + go test -race + build).
  Prefer stdlib. Match surrounding style. Conventional Commits.

  Do not write OpenSpec skills or slash commands into .agents/skills — mow
  loads that tree as agent skills after workspace trust.

rules:
  proposal:
    - Include a Non-goals section
    - Name which binary/module a surface belongs to (stock mow vs external host)
  specs:
    - Use RFC 2119 SHALL/MUST/SHOULD/MAY
    - Scenarios use WHEN/THEN (GIVEN optional)
    - Observable behavior only; implementation paths belong in design.md
    - Do not name private host products or fleet peers
  design:
    - Record rejected alternatives, not only the chosen path
    - Call out trust-boundary and public-sample constraints when they apply

operations:
  apply:
    guidance:
      - Run devenv shell -- just verify before claiming a Go change is done
      - Do not add dependencies without a clear need
  archive:
    guidance:
      - Keep the completion summary to the decision, not a file list
